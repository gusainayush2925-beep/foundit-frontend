<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundIt - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="dash-sidebar" id="sidebar">
            <a href="dashboard.html" class="dash-sidebar-brand">
                <div class="dash-sidebar-brand-icon">🎒</div>
                <h1>FoundIt</h1>
            </a>
            <nav class="dash-sidebar-nav">
                <a href="dashboard.html" class="dash-sidebar-link" data-page="dashboard"><span class="dash-sidebar-icon">🏠</span> Home</a>
                <a href="post-item.html" class="dash-sidebar-link" data-page="post-item"><span class="dash-sidebar-icon">📤</span> Post Item</a>
                <a href="my-items.html" class="dash-sidebar-link" data-page="my-items"><span class="dash-sidebar-icon">📁</span> My Items</a>
                <a href="claims.html" class="dash-sidebar-link" data-page="claims"><span class="dash-sidebar-icon">🔔</span> My Claims</a>
                <a href="messages.html" class="dash-sidebar-link" data-page="messages"><span class="dash-sidebar-icon">💬</span> Messages</a>
                <a href="notifications.html" class="dash-sidebar-link" data-page="notifications"><span class="dash-sidebar-icon">📬</span> Notifications</a>
                <a href="profile.html" class="dash-sidebar-link" data-page="profile"><span class="dash-sidebar-icon">👤</span> Profile</a>
                <div id="adminSection" style="display: none;">
                    <div class="dash-sidebar-section">Admin</div>
                    <a href="admin.html" class="dash-sidebar-link" data-page="admin"><span class="dash-sidebar-icon">👑</span> Admin Panel</a>
                </div>
            </nav>
            <div class="dash-sidebar-footer">
                <div class="dash-sidebar-user" onclick="logout()">
                    <div class="dash-sidebar-user-avatar" id="userAvatar">A</div>
                    <div class="dash-sidebar-user-info">
                        <div class="dash-sidebar-user-name" id="userName">User</div>
                        <div class="dash-sidebar-user-role" id="userRole">Student</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="dash-main">
            <div class="dash-topbar">
                <div class="dash-search">
                    <input type="text" id="searchInput" placeholder="Search for items (e.g. phone, wallet, keys...)">
                </div>
                <div class="dash-topbar-actions">
                    <button class="dash-icon-btn" onclick="window.location.href='notifications.html'">🔔</button>
                    <div class="dash-user-chip" onclick="window.location.href='profile.html'">
                        <div class="dash-user-chip-avatar" id="topAvatar">A</div>
                        <div>
                            <div class="dash-user-chip-name" id="topName">User</div>
                            <div class="dash-user-chip-role" id="topRole">Student</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dash-hero">
                <div class="dash-hero-content">
                    <h1 class="dash-hero-title">Lost Something? <span>Found Something?</span></h1>
                    <p class="dash-hero-subtitle">Connect. Recover. Return. Together for a better campus.</p>
                    <div class="dash-hero-buttons">
                        <a href="post-item.html?type=lost" class="dash-hero-btn dash-hero-btn-primary">+ Report Lost Item</a>
                        <a href="post-item.html?type=found" class="dash-hero-btn dash-hero-btn-secondary">+ Report Found Item</a>
                    </div>
                </div>
                <div class="dash-hero-illustration">🎒</div>
            </div>

            <div class="dash-stats" id="statsRow"></div>

            <div class="dash-filters">
                <button class="dash-filter-chip active" onclick="filterItems('all', this)">All</button>
                <button class="dash-filter-chip" onclick="filterItems('lost', this)">🔴 Lost Items</button>
                <button class="dash-filter-chip" onclick="filterItems('found', this)">🟢 Found Items</button>
                <select class="dash-filter-dropdown" id="categoryFilter" onchange="applyCategoryFilter()">
                    <option value="all">All Categories</option>
                    <option value="Electronics">📱 Electronics</option>
                    <option value="Wallet">👛 Wallet</option>
                    <option value="ID Card">🪪 ID Card</option>
                    <option value="Books">📚 Books</option>
                    <option value="Clothing">👕 Clothing</option>
                    <option value="Accessories">🕶️ Accessories</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>

            <div class="dash-section-header">
                <h2 class="dash-section-title">Recent Items</h2>
                <a href="my-items.html" class="dash-section-link">View All →</a>
            </div>

            <div id="itemsContainer">
                <div class="dash-items-grid">
                    <div class="dash-skeleton"></div>
                    <div class="dash-skeleton"></div>
                    <div class="dash-skeleton"></div>
                    <div class="dash-skeleton"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
