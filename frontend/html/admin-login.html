<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundIt - Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e293b 0%, #4f46e5 100%); padding: 20px;">
        <div style="background: white; padding: 45px 40px; border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,0.3); width: 100%; max-width: 440px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; box-shadow: 0 20px 40px rgba(239, 68, 68, 0.4);">👑</div>
                <div style="display: inline-block; padding: 8px 20px; background: #ef4444; color: white; border-radius: 20px; font-size: 12px; font-weight: 800; letter-spacing: 1px; margin-bottom: 20px;">ADMIN LOGIN</div>
                <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Administrator Access</h1>
                <p style="color: #64748b; font-size: 14px;">Authorized personnel only</p>
            </div>

            <form id="adminLoginForm">
                <div class="form-field">
                    <input type="email" id="email" placeholder=" " required autocomplete="email">
                    <label>Admin Email</label>
                </div>
                <div class="form-field">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label>Password</label>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn" style="background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 8px 32px rgba(239, 68, 68, 0.35);">
                    🔐 Admin Sign In
                </button>
            </form>

            <p class="auth-footer" style="margin-top: 24px;">
                Not an admin? <a href="index.html">Student Login</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const data = await apiRequest('/auth/login', 'POST', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });

                // Check if user is actually admin
                if (data.user.role !== 'admin') {
                    showToast('❌ This page is for admins only!', 'error');
                    btn.disabled = false;
                    btn.textContent = '🔐 Admin Sign In';
                    return;
                }

                saveAuth(data.token, data.user);
                showToast('👑 Welcome Admin!', 'success');
                setTimeout(() => window.location.href = 'admin.html', 800);
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '🔐 Admin Sign In';
            }
        });
    </script>
</body>
</html>
